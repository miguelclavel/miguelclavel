<svg xmlns="http://www.w3.org/2000/svg" width="293" height="228" viewBox="0 0 293 228"><foreignObject x="0" y="0" width="293" height="228"><div xmlns="http://www.w3.org/1999/xhtml" class="dark motion" style="width:293px;margin:0"><style><![CDATA[
  /* One file, every block of the GitHub profile. render.mjs screenshots each
     [data-shot] element twice, once per theme, onto a transparent background.
     Widths include a 6px transparent gutter so tiles sit 12px apart on GitHub. */
  :root { --gut: 6px; }
  .light {
    --text: #1d1d1f; --muted: #6e6e73; --tile: #f5f5f7; --line: #d2d2d7;
    --link: #0066cc; --pill: #0071e3; --pill-text: #fff; --chip: #f5f5f7;
    --g1: #1F5FD1; --g2: #1A8BC4; --g3: #2BB673;
  }
  .dark {
    --text: #f5f5f7; --muted: #a1a1a6; --tile: #1c1c1e; --line: #3a3a3c;
    --link: #2997ff; --pill: #0a84ff; --pill-text: #fff; --chip: #1c1c1e;
    --g1: #5B8DEF; --g2: #3FB0E0; --g3: #3DD68C;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: 'Inter', sans-serif; font-optical-sizing: auto; -webkit-font-smoothing: antialiased; background: transparent; }
  .theme { padding: 20px; display: flex; flex-direction: column; gap: 20px; align-items: flex-start; }
  [data-shot] { padding: var(--gut); color: var(--text); }
  .full { width: 880px; }
  .half { width: 440px; }
  .third { width: 293px; }
  .grad { background: linear-gradient(90deg, var(--g1), var(--g2) 50%, var(--g3)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .more { font-size: 15px; font-weight: 500; color: var(--link); }

  /* Pixel signature: the five colours of the pixel trail on miguelclavel.com */
  .sig { display: grid; grid-template-columns: repeat(4, 9px); grid-auto-rows: 9px; gap: 3px; width: max-content; margin: 0 auto 18px; }
  .sig i { border-radius: 2px; }
  .sig { grid-template-columns: repeat(4, 9px); }
  .sig .b { background: #1F5FD1; grid-area: 3 / 1; } .sig .g { background: #2BB673; grid-area: 2 / 2; }
  .sig .a { background: #F5A524; grid-area: 2 / 3; } .sig .r { background: #F2545B; grid-area: 1 / 4; }

  /* Hero */
  .hero { text-align: center; padding-top: 44px; padding-bottom: 30px; }
  .hero .name { font-size: 19px; font-weight: 600; letter-spacing: -.01em; margin-bottom: 10px; }
  .hero h1 { font-size: 70px; line-height: 1.03; font-weight: 700; letter-spacing: -.037em; }
  .hero .sub { font-size: 20px; line-height: 1.45; color: var(--muted); max-width: 720px; margin: 22px auto 0; letter-spacing: -.005em; text-wrap: balance; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; height: 46px; padding: 0 24px; border-radius: 999px; font-size: 17px; font-weight: 500; letter-spacing: -.01em; }
  .btn.solid { background: var(--pill); color: var(--pill-text); }
  .btn.ghost { box-shadow: inset 0 0 0 1.5px var(--pill); color: var(--link); }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); padding: 26px 8px 24px; }
  .stat { padding: 4px 22px; border-left: 1px solid var(--line); }
  .stat:first-child { border-left: 0; padding-left: 6px; }
  .stat .dot { width: 9px; height: 9px; border-radius: 2px; margin-bottom: 14px; }
  .stat .num { font-size: 40px; font-weight: 700; letter-spacing: -.035em; line-height: 1; white-space: nowrap; }
  .stat .num em { font-style: normal; color: var(--muted); font-weight: 400; font-size: 28px; padding: 0 7px; position: relative; top: -3px; }
  .stat .lbl { font-size: 14px; line-height: 1.42; color: var(--muted); margin-top: 10px; }

  /* Section headings */
  .sec { font-size: 36px; line-height: 1.12; font-weight: 700; letter-spacing: -.028em; padding-top: 30px; padding-bottom: 4px; text-wrap: balance; }
  .sec span { color: var(--muted); }

  /* Tiles */
  .tile { background: var(--tile); border-radius: 22px; overflow: hidden; height: 100%; }
  .work .tile, .built .tile { display: flex; flex-direction: column; }
  .tile .txt { padding: 26px 26px 0; }
  .work .txt { height: 186px; }
  .tile h3 { font-size: 24px; line-height: 1.16; font-weight: 700; letter-spacing: -.024em; margin-top: 8px; }
  .tile .line { font-size: 15px; line-height: 1.45; color: var(--muted); margin-top: 8px; letter-spacing: -.003em; }
  .tile .more { margin-top: 10px; }
  .tile .pic { margin: 0 26px; border-radius: 12px 12px 0 0; overflow: hidden; height: 242px; flex: none; box-shadow: 0 0 0 1px rgba(0,0,0,.04); }
  .tile .pic img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
  .built .txt { height: 196px; }
  .built h3 { font-size: 27px; }
  .built .pic { height: 238px; }
  .built .pic.zoom img { width: 150%; height: auto; margin-left: -25%; object-fit: initial; }
  .built .pic.zoom-s img { width: 127%; height: auto; margin-left: -27%; margin-top: -22px; object-fit: initial; }

  /* Kits */
  .kit .tile { padding: 24px 22px 22px; height: 214px; display: flex; flex-direction: column; }
  .kit svg { width: 30px; height: 30px; flex: none; }
  .kit h3 { font-size: 18px; line-height: 1.2; margin-top: 16px; }
  .kit .line { font-size: 13.5px; }
  .kit .more { font-size: 13.5px; margin-top: auto; }

  /* How I work */
  .how .tile { padding: 34px 34px 32px; }
  .how h3 { font-size: 30px; line-height: 1.15; margin-top: 10px; max-width: 560px; }
  .qs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; margin-top: 28px; }
  .q b { display: block; font-size: 34px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
  .q p { font-size: 17px; line-height: 1.38; font-weight: 600; letter-spacing: -.012em; margin-top: 12px; }
  .ai { margin-top: 30px; padding-top: 22px; border-top: 1px solid var(--line); font-size: 15px; line-height: 1.5; color: var(--muted); }
  .ai strong { color: var(--text); font-weight: 600; }

  /* Experience */
  .exp .row { display: grid; grid-template-columns: 128px 1fr; gap: 18px; padding: 16px 0 16px 6px; border-top: 1px solid var(--line); }
  .exp .row:first-child { border-top: 0; }
  .exp .when { font-size: 15px; color: var(--muted); padding-top: 2px; font-variant-numeric: tabular-nums; }
  .exp .co { font-size: 18px; font-weight: 600; letter-spacing: -.015em; }
  .exp .role { font-size: 15px; line-height: 1.45; color: var(--muted); margin-top: 3px; }

  /* Toolkit chips */
  .tools { padding: 24px 22px 24px 0; }
  .exp { padding: 8px 22px 8px 0; }
  .tools .grp { display: grid; grid-template-columns: 128px 1fr; gap: 18px; padding-left: 6px; }
  .tools .grp + .grp { margin-top: 16px; }
  .tools .lab { font-size: 15px; color: var(--muted); padding-top: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { font-size: 14px; padding: 7px 13px; border-radius: 999px; background: var(--chip); letter-spacing: -.005em; }

  /* Heading mark: three pixels from the pixel trail, before every section title. */
  .sec em { font-style: normal; }
  .mark { display: inline-flex; gap: 3px; margin-right: 12px; vertical-align: 0.18em; }
  .mark b { width: 7px; height: 7px; border-radius: 1.5px; display: block; }
  .mark b:nth-child(1) { background: #1F5FD1; } .mark b:nth-child(2) { background: #2BB673; } .mark b:nth-child(3) { background: #F5A524; }
  .exp { position: relative; }

  /* Motion, only in the animated SVG versions (render-motion.mjs adds the .motion class).
     Each block rises in once, then keeps one quiet loop, because GitHub loads every image
     at once and the entrance is over before anyone scrolls down. */
  .motion { --ease: cubic-bezier(.16, 1, .3, 1);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .motion.wide { font-family: "Helvetica Neue", Arial, sans-serif; }
  .light { --chip-hi: #e3e3e8; } .dark { --chip-hi: #2f2f33; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop { 0% { opacity: 0; transform: scale(.2); } 70% { opacity: 1; transform: scale(1.18); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes trail { 0%, 100% { opacity: .35; } 10% { opacity: 1; } 28% { opacity: .35; } }
  @keyframes drift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  @keyframes pulse { 0%, 84%, 100% { transform: scale(1); } 90% { transform: scale(1.5); } }
  @keyframes beat { 0%, 70%, 100% { transform: none; } 78% { transform: translateY(-4px); } }
  @keyframes glow { 0%, 100% { background: var(--chip); } 4%, 7% { background: var(--chip-hi); } 12% { background: var(--chip); } }
  @keyframes travel { 0%, 8% { top: 18px; } 92%, 100% { top: calc(100% - 40px); } }
  .motion .hero .sig i { opacity: 0; animation: pop .7s var(--ease) calc(var(--i) * 90ms) forwards, trail 4s ease-in-out calc(2s + var(--i) * 250ms) infinite; }
  .motion .hero .name { opacity: 0; animation: rise 1s var(--ease) .35s forwards; }
  .motion .hero .l1 { display: inline-block; opacity: 0; animation: rise 1.1s var(--ease) .5s forwards; }
  .motion .hero .grad { display: inline-block; opacity: 0; background-image: linear-gradient(90deg, var(--g1), var(--g2), var(--g3), var(--g2), var(--g1)); background-size: 220% 100%;
    animation: rise 1.1s var(--ease) .68s forwards, drift 10s ease-in-out 2s infinite; }
  .motion .hero .sub { opacity: 0; animation: rise 1s var(--ease) .9s forwards; }
  .motion .stat { opacity: 0; animation: rise .9s var(--ease) calc(var(--i) * 110ms) forwards; }
  .motion .stat .dot { animation: pulse 6s var(--ease) calc(1.5s + var(--i) * 1.5s) infinite; }
  .motion .sec em { display: inline-block; opacity: 0; animation: rise 1s var(--ease) .1s forwards; }
  .motion .sec .mark { display: inline-flex; opacity: 0; animation: rise 1s var(--ease) .1s forwards; }
  .motion .sec span { opacity: 0; animation: fade 1.2s ease .45s forwards; }
  .motion .sec .mark b { animation: trail 3.6s ease-in-out calc(1.2s + var(--i) * 300ms) infinite; }
  .motion .how .tile { opacity: 0; animation: rise 1s var(--ease) forwards; }
  .motion .how .q { opacity: 0; animation: rise .9s var(--ease) calc(.3s + var(--i) * 140ms) forwards; }
  .motion .how .q b { display: inline-block; animation: beat 6s var(--ease) calc(2s + var(--i) * 2s) infinite; }
  .motion .how .ai { opacity: 0; animation: fade 1.2s ease .9s forwards; }
  .motion .exp .row { opacity: 0; animation: rise .9s var(--ease) calc(var(--i) * 110ms) forwards; padding-left: 20px; }
  .motion .tools .grp { padding-left: 20px; }
  .motion { -webkit-font-smoothing: antialiased; }
  .motion .chip { opacity: 0; animation: pop .5s var(--ease) calc(var(--i) * 35ms) forwards, glow 9s linear calc(2s + var(--i) * 520ms) infinite; }
  /* The light around every box: a short blue to green stroke that glides along the edge.
     render-motion.mjs adds the svg.trace to each .tile, sized in pixels, with its own pace. */
  .light { --edge: rgba(0,0,0,.06); } .dark { --edge: rgba(255,255,255,.075); }
  .motion .tile { position: relative; box-shadow: inset 0 0 0 1px var(--edge); opacity: 0; animation: rise 1s var(--ease) .05s forwards; }
  .motion .trace { position: absolute; left: 0; top: 0; pointer-events: none; opacity: 0; animation: fade 1.2s ease var(--start) forwards; }
  .motion .trace rect { fill: none; stroke-linecap: round; stroke-dasharray: 80 920; animation: orbit var(--dur) linear var(--start) infinite; }
  .motion .trace .line { stroke-width: 1.6; }
  .motion .trace .glow { stroke-width: 7; opacity: .28; }
  @keyframes orbit { from { stroke-dashoffset: var(--from); } to { stroke-dashoffset: calc(var(--from) - 1000); } }
  .motion .kit .icon * { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.6s var(--ease) .5s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .motion .work .pic img, .motion .built .pic img { transform-origin: 50% 25%; animation: zoom 18s ease-in-out 1.5s infinite alternate; }
  @keyframes zoom { from { transform: scale(1); } to { transform: scale(1.05); } }
  .motion .stats .stat:first-child { padding-left: 22px; }
  @media (prefers-reduced-motion: reduce) {
    .motion *, .motion *::after { animation: none !important; opacity: 1 !important; transform: none !important; }
    .motion .kit .icon * { stroke-dashoffset: 0 !important; }
  }
]]></style><div xmlns="http://www.w3.org/1999/xhtml" data-shot="kit-1" data-motion="" class="third kit"><article class="tile">
    <svg xmlns="http://www.w3.org/2000/svg" class="icon" viewBox="0 0 30 30" fill="none" stroke="#1F5FD1" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3.5c.6 4.9 2.6 6.9 7.5 7.5-4.9.6-6.9 2.6-7.5 7.5-.6-4.9-2.6-6.9-7.5-7.5 4.9-.6 6.9-2.6 7.5-7.5Z" pathLength="1"/><path d="M24 19.5c.25 2 1.05 2.8 3 3-1.95.2-2.75 1-3 3-.25-2-1.05-2.8-3-3 1.95-.2 2.75-1 3-3Z" pathLength="1"/></svg>
    <h3>AI UX patterns</h3><p class="line">Seven patterns for AI people can trust, each with a live demo.</p><p class="more">View on GitHub ›</p><svg xmlns="http://www.w3.org/2000/svg" class="trace" width="281" height="214" viewBox="0 0 281 214" style="--dur: 11s; --start: 1.75s; --from: 393;"><defs><linearGradient id="edge9" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--g1)"/><stop offset="1" style="stop-color:var(--g3)"/></linearGradient></defs><rect class="glow" x="0.8" y="0.8" width="279.4" height="212.4" rx="21.2" pathLength="1000" stroke="url(#edge9)"/><rect class="line" x="0.8" y="0.8" width="279.4" height="212.4" rx="21.2" pathLength="1000" stroke="url(#edge9)"/></svg></article></div></div></foreignObject></svg>
